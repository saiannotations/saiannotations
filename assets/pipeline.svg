<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="1000" height="220" role="img" aria-label="Annotation pipeline: read guideline, calibrate, label, self-QA, log edge cases">
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .sans{font-family:'Segoe UI',-apple-system,Helvetica,Arial,sans-serif}
    .packet{animation:move 8s linear infinite}
    @keyframes move{from{transform:translateX(0)}to{transform:translateX(800px)}}
    .n1{animation:lit 8s infinite 0s}.n2{animation:lit 8s infinite 2s}.n3{animation:lit 8s infinite 4s}.n4{animation:lit 8s infinite 6s}.n5{animation:lit 8s infinite 7.9s}
    @keyframes lit{0%,12%{fill:#ff5c93}20%,100%{fill:#161a22}}
  </style>
  <rect width="1000" height="220" rx="14" fill="#0f1218"/>
  <rect x="1" y="1" width="998" height="218" rx="13" fill="none" stroke="#272d3a"/>
  <text x="28" y="36" class="mono" font-size="13" fill="#6f7a8f">pipeline: every batch</text>
  <text x="972" y="36" class="mono" font-size="13" fill="#6f7a8f" text-anchor="end">guideline → delivery</text>
  <line x1="100" y1="96" x2="900" y2="96" stroke="#343b4b" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/>
  <g class="packet"><rect x="88" y="88" width="24" height="16" fill="none" stroke="#ff5c93" stroke-width="2"/><rect x="88" y="80" width="14" height="8" fill="#ff5c93"/></g>
  <g class="sans" text-anchor="middle">
    <g><circle class="n1" cx="100" cy="96" r="22" fill="#161a22" stroke="#ff5c93" stroke-width="2"/><text x="100" y="102" class="mono" font-size="15" fill="#e8ebf1">1</text>
      <text x="100" y="150" font-size="16" font-weight="700" fill="#e8ebf1">Read guideline</text><text x="100" y="172" class="mono" font-size="12" fill="#8b94a7">classes · rules</text></g>
    <g><circle class="n2" cx="300" cy="96" r="22" fill="#161a22" stroke="#ff5c93" stroke-width="2"/><text x="300" y="102" class="mono" font-size="15" fill="#e8ebf1">2</text>
      <text x="300" y="150" font-size="16" font-weight="700" fill="#e8ebf1">Calibrate</text><text x="300" y="172" class="mono" font-size="12" fill="#8b94a7">gold set check</text></g>
    <g><circle class="n3" cx="500" cy="96" r="22" fill="#161a22" stroke="#ff5c93" stroke-width="2"/><text x="500" y="102" class="mono" font-size="15" fill="#e8ebf1">3</text>
      <text x="500" y="150" font-size="16" font-weight="700" fill="#e8ebf1">Label</text><text x="500" y="172" class="mono" font-size="12" fill="#8b94a7">hotkeys · class order</text></g>
    <g><circle class="n4" cx="700" cy="96" r="22" fill="#161a22" stroke="#ff5c93" stroke-width="2"/><text x="700" y="102" class="mono" font-size="15" fill="#e8ebf1">4</text>
      <text x="700" y="150" font-size="16" font-weight="700" fill="#e8ebf1">Self-QA</text><text x="700" y="172" class="mono" font-size="12" fill="#8b94a7">scrub · validate</text></g>
    <g><circle class="n5" cx="900" cy="96" r="22" fill="#161a22" stroke="#ff5c93" stroke-width="2"/><text x="900" y="102" class="mono" font-size="15" fill="#e8ebf1">5</text>
      <text x="900" y="150" font-size="16" font-weight="700" fill="#e8ebf1">Log edge cases</text><text x="900" y="172" class="mono" font-size="12" fill="#8b94a7">edge_case_log.md</text></g>
  </g>
</svg>
