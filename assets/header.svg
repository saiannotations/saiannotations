<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-label="Sai Pavan Vanka, Data Annotation Specialist, Dallas TX">
  <style>
    .name{font:800 78px 'Segoe UI',-apple-system,Helvetica,Arial,sans-serif;fill:#e8ebf1;letter-spacing:-2px}
    .role{font:500 28px 'Segoe UI',-apple-system,Helvetica,Arial,sans-serif;fill:#a3abbd}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .drive{animation:drive 10s linear infinite}
    .drive2{animation:drive2 13s linear infinite}
    .scan{animation:scan 6s ease-in-out infinite alternate}
    .blink{animation:blink 1.2s steps(1) infinite}
    .frame{animation:blink 1.2s steps(1) infinite}
    @keyframes drive{from{transform:translateX(-200px)}to{transform:translateX(1340px)}}
    @keyframes drive2{from{transform:translateX(1340px)}to{transform:translateX(-200px)}}
    @keyframes scan{from{transform:translate(0,0)}to{transform:translate(-300px,48px)}}
    @keyframes blink{50%{opacity:0}}
  </style>
  <defs>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1f2531"/></pattern>
    <linearGradient id="f" x1="0" x2="1"><stop offset="0" stop-color="#0f1218"/><stop offset=".6" stop-color="#0f1218" stop-opacity=".55"/><stop offset="1" stop-color="#0f1218" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="1280" height="340" rx="14" fill="#0f1218"/>
  <rect width="1280" height="340" rx="14" fill="url(#g)"/>
  <rect width="1280" height="340" rx="14" fill="url(#f)"/>

  <!-- tool chrome -->
  <g class="mono" font-size="13" fill="#6f7a8f">
    <text x="28" y="34">annotator.app — profile.png</text>
    <text x="1252" y="34" text-anchor="end">LABELING</text>
  </g>
  <circle class="blink" cx="1150" cy="29" r="5" fill="#ff5c93"/>

  <!-- region corners around the name block -->
  <g stroke="#ff5c93" stroke-width="3" fill="none">
    <path d="M44 84V64H72"/><path d="M712 64H740V84"/><path d="M44 230V250H72"/><path d="M712 250H740V230"/>
  </g>
  <rect x="44" y="50" width="196" height="22" fill="#ff5c93"/>
  <text x="52" y="66" class="mono" font-size="13" fill="#1a0710">annotator · conf 0.99</text>

  <text x="70" y="152" class="name">Sai Pavan Vanka</text>
  <text x="72" y="198" class="role">Data Annotation Specialist · Dallas, TX</text>
  <text x="72" y="230" class="mono" font-size="15" fill="#6f7a8f">bbox · tracking · polygons · keypoints · NER · LLM evaluation</text>

  <!-- crosshair -->
  <g class="scan">
    <line x1="1080" y1="48" x2="1080" y2="272" stroke="#ff5c93" stroke-opacity=".45"/>
    <line x1="880" y1="130" x2="1280" y2="130" stroke="#ff5c93" stroke-opacity=".45"/>
    <rect x="1088" y="138" width="150" height="22" fill="#e8ebf1"/>
    <text x="1096" y="154" class="mono" font-size="13" fill="#0f1218">x 1080 · y 0130</text>
  </g>

  <!-- road with tracked objects -->
  <rect x="0" y="272" width="1280" height="68" fill="#161a22"/>
  <rect x="0" y="272" width="1280" height="2" fill="#272d3a"/>
  <g fill="#2e3545"><rect x="20" y="304" width="50" height="4"/><rect x="140" y="304" width="50" height="4"/><rect x="260" y="304" width="50" height="4"/><rect x="380" y="304" width="50" height="4"/><rect x="500" y="304" width="50" height="4"/><rect x="620" y="304" width="50" height="4"/><rect x="740" y="304" width="50" height="4"/><rect x="860" y="304" width="50" height="4"/><rect x="980" y="304" width="50" height="4"/><rect x="1100" y="304" width="50" height="4"/><rect x="1220" y="304" width="50" height="4"/></g>
  <g class="drive">
    <rect x="10" y="296" width="120" height="22" rx="6" fill="#b8433a"/>
    <polygon points="34,296 52,280 98,280 114,296" fill="#b8433a"/>
    <polygon points="42,295 55,284 74,284 74,295" fill="#cfe3ee"/><polygon points="78,284 96,284 106,295 78,295" fill="#cfe3ee"/>
    <circle cx="38" cy="319" r="10" fill="#07090c"/><circle cx="104" cy="319" r="10" fill="#07090c"/>
    <rect x="6" y="277" width="128" height="53" fill="#ff2e7a" fill-opacity=".1" stroke="#ff2e7a" stroke-width="2"/>
    <rect x="6" y="263" width="60" height="14" fill="#ff2e7a"/><text x="10" y="274" class="mono" font-size="10" fill="#fff">car #1</text>
  </g>
  <g class="drive2">
    <g stroke="#cfd5e0" stroke-width="2.5" fill="none"><circle cx="20" cy="318" r="11"/><circle cx="58" cy="318" r="11"/><path d="M20 318 L34 302 L58 318 M34 302 L52 302"/></g>
    <line x1="34" y1="302" x2="42" y2="286" stroke="#9b55ff" stroke-width="6" stroke-linecap="round"/><circle cx="44" cy="279" r="5.5" fill="#cfd5e0"/>
    <rect x="5" y="270" width="68" height="62" fill="#9b55ff" fill-opacity=".1" stroke="#9b55ff" stroke-width="2"/>
    <rect x="5" y="256" width="76" height="14" fill="#9b55ff"/><text x="9" y="267" class="mono" font-size="10" fill="#fff">cyclist #6</text>
  </g>
</svg>
